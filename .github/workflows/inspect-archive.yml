name: Extract ZIP permanently

on:
  push:
    paths:
      - ".github/workflows/inspect-archive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and safely extract archive
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, stat

          archive = pathlib.Path("Ejshwuwy6w-main.zip")
          staging = pathlib.Path("work/unpacked").resolve()
          staging.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              print(f"Archive: {archive.name}")
              print(f"Entries: {len(infos)}")
              for info in infos:
                  p = pathlib.PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe archive path rejected: {info.filename}")
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink entry rejected: {info.filename}")
                  dest = (staging / pathlib.Path(*p.parts)).resolve()
                  if staging not in dest.parents and dest != staging:
                      raise SystemExit(f"Path escapes extraction directory: {info.filename}")
              z.extractall(staging)

          project = staging / "Ejshwuwy6w-main"
          if not project.is_dir():
              raise SystemExit("Expected top-level folder Ejshwuwy6w-main was not found")
          destination = pathlib.Path("Ejshwuwy6w-main")
          if destination.exists():
              raise SystemExit("Destination Ejshwuwy6w-main already exists; refusing to overwrite it")
          import shutil
          shutil.copytree(project, destination)
          files = [p for p in destination.rglob("*") if p.is_file()]
          print(f"Persisted extraction prepared: {len(files)} files")
          for p in sorted(files):
              print(p)
          PY

      - name: Commit extracted project into repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Ejshwuwy6w-main"
          git commit -m "Extract project archive into repository"
          git push origin HEAD:main
